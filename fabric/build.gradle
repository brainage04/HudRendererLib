plugins {
	id 'io.github.brainage04.maven-central-publishing' version "${minecraftmodconventions_version}"
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	exclusiveContent {
		forRepository { maven { url = "https://maven.shedaniel.me/" } }
		filter { includeGroup "me.shedaniel.cloth" }
	}
	exclusiveContent {
		forRepository { maven { url = "https://maven.terraformersmc.com/releases/" } }
		filter { includeGroup "com.terraformersmc" }
	}
}

mavenCentralPublishing {
	repository.set('brainage04/HudRendererLib')
	publicationName.set(rootProject.mod_name)
	description.set('A library for rendering Heads-Up Display (HUD) elements in Fabric mods for Minecraft.')
	localRepository.set(rootProject.layout.buildDirectory.dir('local-repo'))
}

tasks.named('publishToMavenCentral') {
	dependsOn ':neoforge:publishMavenJavaPublicationToCentralRepository'
}

fabricApi { configureDataGeneration { client = true } }

dependencies {
	// ModMenu: compile-only so the published POM does not force an optional integration (and a non-Central repository) on consumers.
	compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { exclude group: "net.fabricmc.fabric-api" }
	productionRuntimeMods("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { exclude group: "net.fabricmc.fabric-api" }

	// Cloth Config
	implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") { exclude group: "net.fabricmc.fabric-api" }
	productionRuntimeMods("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") { exclude group: "net.fabricmc.fabric-api" }
}

tasks.register('javadocJar', Jar) {
	archiveClassifier = 'javadoc'
	from rootProject.file('README.md')
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = rootProject.archives_base_name
			from components.java
			artifact tasks.named('javadocJar')
		}
	}
}

// jqwik 1.10.2 is built on JUnit Platform 1.14, so the JUnit modules follow the same release line.
dependencies {
	testImplementation platform('org.junit:junit-bom:5.14.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'net.jqwik:jqwik:1.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// fabric-loader-junit runs the tests inside the Fabric loader, where jqwik finds no @Property methods
// (MagicCarpet's CarpetMotionTest ran 6 of its 10 tests there, 14 Nov 2026). The other unit tests keep running
// inside the loader, so the tests of the layout arithmetic get a task of their own without it.
def propertyTests = 'io/github/brainage04/hudrendererlib/hud/core/**'
tasks.named('test') {
	exclude propertyTests
}
def propertyTest = tasks.register('propertyTest', Test) {
	description = 'Runs the jqwik property tests outside the Fabric loader.'
	group = 'verification'
	def unitTest = tasks.named('test', Test).get()
	testClassesDirs = unitTest.testClassesDirs
	classpath = unitTest.classpath.filter { !it.name.startsWith('fabric-loader-junit') }
	include propertyTests
	useJUnitPlatform()
}
tasks.named('check') {
	dependsOn propertyTest
}

pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['io.github.brainage04.hudrendererlib.hud.core.HudLayout']
	targetTests = ['io.github.brainage04.hudrendererlib.hud.core.*Test']
	additionalMutableCodePaths = project(':common').sourceSets.main.output.classesDirs.files
	threads = 1
	timeoutConstInMillis = 5000
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
tasks.named('pitest') {
	dependsOn ':common:classes'
	// With fabric-loader-junit on the classpath PIT records no coverage (SimpleTwitchChat measured 0 of 90 lines).
	def classpath = files(additionalClasspath.from.toList())
	additionalClasspath.setFrom(classpath.filter { !it.name.startsWith('fabric-loader-junit') })
}
