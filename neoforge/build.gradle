plugins {
	id 'io.github.brainage04.maven-central-publishing' version "${fabricmoddingconventions_version}"
}

repositories {
	exclusiveContent {
		forRepository { maven { url = "https://maven.shedaniel.me/" } }
		filter { includeGroup "me.shedaniel.cloth" }
	}
}

mavenCentralPublishing {
	repository.set('brainage04/HudRendererLib')
	publicationName.set(rootProject.mod_name)
	description.set('A library for rendering Heads-Up Display (HUD) elements in NeoForge mods for Minecraft.')
	localRepository.set(rootProject.layout.buildDirectory.dir('local-repo'))
}

dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}" }

tasks.register('javadocJar', Jar) {
	archiveClassifier = 'javadoc'
	from rootProject.file('README.md')
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = "${rootProject.archives_base_name}-neoforge"
			from components.java
			artifact tasks.named('javadocJar')
		}
	}
}

def clientGameTestDirectory = rootProject.file('run/clientGameTest/neoforge')

loom {
	runs {
		clientGameTest {
			client()
			name 'HudRendererLib NeoForge Client GameTest'
			source sourceSets.gametest
			runDir clientGameTestDirectory.absolutePath
			property 'hudrendererlib.clientGameTest', 'true'
		}
	}
}

tasks.register('clearClientGameTestWorld', Delete) {
	delete new File(clientGameTestDirectory, 'saves/hudrendererlib-client-gametest')
}

def fabricOptions = project(':fabric').tasks.named('prepareClientGameTestRun')
tasks.register('prepareClientGameTestRun', io.github.brainage04.fabricmoddingconventions.gradle.recorder.PrepareClientGameTestRunTask) {
	recordingAudioDevice.set('')
	minecraftOptionsVersion.set(fabricOptions.flatMap { it.minecraftOptionsVersion })
	maxFps.set('60')
	renderDistance.set('2')
	simulationDistance.set('2')
	guiScale.set('2')
	fullscreen.set('false')
	disableSocialInteractionsToast.set(true)
	optionsFile.set(new File(clientGameTestDirectory, 'options.txt'))
}

tasks.named('runClientGameTest') {
	dependsOn clearClientGameTestWorld
	dependsOn prepareClientGameTestRun
	doLast {
		def log = new File(clientGameTestDirectory, 'logs/latest.log')
		if (!log.exists() || !log.text.contains('HUD_NEOFORGE_CLIENT_GAMETEST_PASS')) {
			throw new GradleException('NeoForge client GameTest did not complete its assertions.')
		}
	}
}

rootProject.tasks.named('runAllGameTests') {
	dependsOn ':neoforge:runClientGameTest'
}

gradle.projectsEvaluated {
	def assetDownloads = [
			project(':fabric').tasks.named('downloadAssets'),
			tasks.named('downloadAssets')
	]
	project(':fabric').tasks.named('runProductionClientGameTest') {
		mustRunAfter assetDownloads
	}
	tasks.named('runClientGameTest') {
		mustRunAfter assetDownloads
		mustRunAfter project(':fabric').tasks.named('runProductionClientGameTest')
	}
}
